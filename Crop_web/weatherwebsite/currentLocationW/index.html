<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('background.jpg'); 
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      color: white;
    }

    .wrapper {
      background: rgba(0, 0, 0, 0.5); 
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: 50px auto;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <section class="input-part">
      <p class="info-txt"></p>
      <div class="content">
        <input style="background: #03bef6;" name="cityName" type="text" spellcheck="false" placeholder="Enter city name" required>
        <button>Current Location Weather</button>
      </div>
    </section>

    <section class="weather-part">
      <img src="" alt="Weather Icon" id="weather-icon">
      <div class="temp">
        <span class="numb">_</span><span class="deg">°</span>C
      </div>
      <div class="weather">--</div>
      <div class="location">
        <i class='bx bx-map'></i>
        <span>--</span>
      </div>
      <div class="bottom-details">
        <div class="column feels">
          <i class='bx bxs-thermometer'></i>
          <div class="details">
            <div class="temp">
              <span class="numb-2">_</span><span class="deg">°</span>C
            </div>
            <p>Feels like</p>
          </div>
        </div>
        <div class="column humidity">
          <i class='bx bxs-droplet-half'></i>
          <div class="details">
            <span class="humidity-val">_</span>
            <p>Humidity</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
